name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # vendor/swimlane.js を media/ へ同梱してから、markdown-it のプラグインとして
      # swimlane フェンスだけを図にできているかを確かめる。
      - run: npm test
